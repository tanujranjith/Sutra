name: CI — verified artifact

on:
  push:
    branches:
      - "codex/**"
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      full_browser_matrix:
        description: "Also run Firefox, WebKit, and responsive projects"
        required: false
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24"

jobs:
  build-and-check:
    name: Build, static checks, and unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check:all
      - run: npm run test:unit
      - run: npm run build:deploy
      - run: npm run check:deploy
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-deploy-${{ github.sha }}
          path: .deploy/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  browser-tests:
    name: Browser tests (Chromium shard ${{ matrix.shard }}, verified artifact)
    needs: build-and-check
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-deploy-${{ github.sha }}
          path: .deploy
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-chromium
      - run: npx playwright install --with-deps chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
      - name: Test the verified artifact
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
          SUTRA_SERVE_ROOT: .deploy
        # The static app is intentionally boot-tested from a clean browser
        # context. Two workers keep the three shards parallel without
        # overloading the shared GitHub runner during cold startup.
        run: |
          if [ "${{ matrix.shard }}" = "2" ]; then
            # Surface paper-boundary regressions before the longer editor shard.
            npx playwright test tests/e2e/notes-page-layout.spec.mjs --workers=1 --project=chromium
            # Check Homework picker containment before the longer regression shard.
            npx playwright test tests/e2e/notes-sidebar-containment.spec.mjs --grep 'scrolling the Homework class picker' --workers=1 --project=chromium
            # Verify the clean HTML restore baseline before the full shard.
            npx playwright test tests/e2e/html-page-transfer.spec.mjs --workers=1 --project=chromium
          fi
          if [ "${{ matrix.shard }}" = "3" ]; then
            # Surface cross-tab backup conflicts before the full shard output.
            npx playwright test tests/e2e/sutra-cloud-providers.spec.mjs --grep 'scheduled backups upload ciphertext once across two tabs and stop when disabled' --workers=1 --project=chromium
          fi
          npx playwright test --workers=2 --project=chromium --shard=${{ matrix.shard }}/${{ strategy.job-total }}
      - name: Upload failure diagnostics
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-chromium-failure-${{ github.sha }}-${{ matrix.shard }}
          path: .tmp/playwright-results/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

  browser-compatibility-matrix:
    name: Browser compatibility (${{ matrix.label }}, verified artifact)
    needs: build-and-check
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full_browser_matrix) }}
    runs-on: ubuntu-24.04
    strategy:
      # Sutra is a large classic-script application. Running every engine in one
      # two-worker Playwright process caused independent browser contexts to
      # contend for cold-start and IndexedDB initialization, producing
      # non-reproducible failures. Keep each browser lane serial and isolated;
      # the lanes themselves run concurrently on GitHub-hosted runners.
      fail-fast: false
      matrix:
        include:
          - label: Desktop Chrome shard 1
            id: chrome
            project_args: --project=chrome
            browser_install: chrome
            shard: 1
            shard_total: 3
          - label: Desktop Chrome shard 2
            id: chrome
            project_args: --project=chrome
            browser_install: chrome
            shard: 2
            shard_total: 3
          - label: Desktop Chrome shard 3
            id: chrome
            project_args: --project=chrome
            browser_install: chrome
            shard: 3
            shard_total: 3
          - label: Desktop Firefox shard 1
            id: firefox
            project_args: --project=firefox
            browser_install: firefox
            shard: 1
            shard_total: 3
          - label: Desktop Firefox shard 2
            id: firefox
            project_args: --project=firefox
            browser_install: firefox
            shard: 2
            shard_total: 3
          - label: Desktop Firefox shard 3
            id: firefox
            project_args: --project=firefox
            browser_install: firefox
            shard: 3
            shard_total: 3
          - label: Desktop WebKit shard 1
            id: webkit
            project_args: --project=webkit
            browser_install: webkit
            shard: 1
            shard_total: 6
          - label: Desktop WebKit shard 2
            id: webkit
            project_args: --project=webkit
            browser_install: webkit
            shard: 2
            shard_total: 6
          - label: Desktop WebKit shard 3
            id: webkit
            project_args: --project=webkit
            browser_install: webkit
            shard: 3
            shard_total: 6
          - label: Desktop WebKit shard 4
            id: webkit
            project_args: --project=webkit
            browser_install: webkit
            shard: 4
            shard_total: 6
          - label: Desktop WebKit shard 5
            id: webkit
            project_args: --project=webkit
            browser_install: webkit
            shard: 5
            shard_total: 6
          - label: Desktop WebKit shard 6
            id: webkit
            project_args: --project=webkit
            browser_install: webkit
            shard: 6
            shard_total: 6
          - label: Responsive devices
            id: responsive
            project_args: --project=mobile-chromium --project=mobile-webkit --project=tablet --project=narrow-desktop
            browser_install: chromium firefox webkit
            shard: full
            shard_total: full
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-deploy-${{ github.sha }}
          path: .deploy
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ matrix.id }}
      - run: npx playwright install --with-deps ${{ matrix.browser_install }}
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
      - name: Test the verified artifact in the isolated compatibility lane
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
          SUTRA_SERVE_ROOT: .deploy
        run: |
          if [ "${{ matrix.id }}" = "webkit" ] && [ "${{ matrix.shard }}" = "2" ]; then
            # Report Drive prompt/lock regressions before the longer WebKit shard.
            npx playwright test tests/e2e/google-drive-sync.spec.mjs --grep 'locking Drive sync|Drive restore rejects wrong password' --workers=1 --project=webkit
          fi
          if [ "${{ matrix.id }}" = "webkit" ] && [ "${{ matrix.shard }}" = "3" ]; then
            npx playwright test tests/e2e/settings-global-search.spec.mjs --grep '320px' --workers=1 --project=webkit
            npx playwright test tests/e2e/update-banner-layering.spec.mjs --workers=1 --project=webkit
          fi
          if [ "${{ matrix.id }}" = "webkit" ] && [ "${{ matrix.shard }}" = "5" ]; then
            npx playwright test tests/e2e/notes-editor-v2.spec.mjs --grep 'passage writing command reviews' --workers=1 --project=webkit
          fi
          if [ "${{ matrix.id }}" = "webkit" ] && [ "${{ matrix.shard }}" = "6" ]; then
            npx playwright test tests/e2e/navigation-clarity.spec.mjs --grep 'header utilities stay clear' --workers=1 --project=webkit
          fi
          if [ "${{ matrix.id }}" = "firefox" ] && [ "${{ matrix.shard }}" = "3" ]; then
            npx playwright test tests/e2e/student-editing-controls.spec.mjs --grep 'plain-text paste strips' --workers=1 --project=firefox
          fi
          if [ "${{ matrix.id }}" = "firefox" ] && [ "${{ matrix.shard }}" = "2" ]; then
            npx playwright test tests/e2e/notes-editor-v2.spec.mjs --grep 'passage writing command reviews' --workers=1 --project=firefox
            npx playwright test tests/e2e/notes-page-layout.spec.mjs --grep 'Pages mode paginates long paragraphs' --workers=1 --project=firefox
          fi
          if [ "${{ matrix.id }}" = "responsive" ]; then
            npx playwright test --workers=1 ${{ matrix.project_args }}
          else
            npx playwright test --workers=1 ${{ matrix.project_args }} --shard=${{ matrix.shard }}/${{ matrix.shard_total }}
          fi
      - name: Upload failure diagnostics
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-compatibility-failure-${{ github.sha }}-${{ matrix.id }}-${{ matrix.shard }}
          path: .tmp/playwright-results/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14
