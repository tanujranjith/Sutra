name: CI — verified artifact

on:
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      full_browser_matrix:
        description: "Also run Firefox, WebKit, and responsive projects"
        required: false
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "20"
  PLAYWRIGHT_BROWSERS_PATH: ~/.cache/ms-playwright

jobs:
  build-and-check:
    name: Build, static checks, and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check:all
      - run: npm run test:unit
      - run: npm run build:deploy
      - run: npm run check:deploy
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-deploy-${{ github.sha }}
          path: .deploy/
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true

  browser-tests:
    name: Browser tests (Chromium, verified artifact)
    needs: build-and-check
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-deploy-${{ github.sha }}
          path: .deploy
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-chromium
      - run: npx playwright install --with-deps chromium
      - name: Test the verified artifact
        env:
          SUTRA_SERVE_ROOT: .deploy
        run: npm run test:e2e:chromium
      - name: Upload failure diagnostics
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-chromium-failure-${{ github.sha }}
          path: .tmp/playwright-results/
          if-no-files-found: ignore
          retention-days: 14

  browser-compatibility-matrix:
    name: Browser compatibility (verified artifact)
    needs: build-and-check
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full_browser_matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-deploy-${{ github.sha }}
          path: .deploy
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-all
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Test the verified artifact across browsers and viewports
        env:
          SUTRA_SERVE_ROOT: .deploy
        run: npm run test:e2e
      - name: Upload failure diagnostics
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-compatibility-failure-${{ github.sha }}
          path: .tmp/playwright-results/
          if-no-files-found: ignore
          retention-days: 14
