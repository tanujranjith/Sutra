<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sutra Assistant</title>
<link rel="icon" type="image/png" href="assets/brand/sutra/generated/sutra-assistant-icon-32.png">
<style>
/* ── Reset ──────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; overflow: hidden; }

/* ── Background ─────────────────────────────────────── */
body {
  background:
    radial-gradient(ellipse at 12% 18%, rgba(124,92,191,0.22) 0%, transparent 52%),
    radial-gradient(ellipse at 88% 72%, rgba(88,130,191,0.16) 0%, transparent 48%),
    radial-gradient(ellipse at 55% 42%, rgba(60,30,100,0.10) 0%, transparent 58%),
    #09091a;
  color: #ddddf5;
}

.orb {
  position: fixed;
  border-radius: 50%;
  filter: blur(90px);
  pointer-events: none;
  z-index: 0;
  animation: orb-drift 24s ease-in-out infinite alternate;
}
.orb-1 {
  width: 520px; height: 520px;
  background: radial-gradient(circle, rgba(124,92,191,0.20) 0%, transparent 68%);
  top: -160px; left: -160px; animation-duration: 20s;
}
.orb-2 {
  width: 420px; height: 420px;
  background: radial-gradient(circle, rgba(88,130,191,0.16) 0%, transparent 68%);
  bottom: -120px; right: -120px; animation-duration: 26s; animation-delay: -9s;
}
.orb-3 {
  width: 300px; height: 300px;
  background: radial-gradient(circle, rgba(180,90,160,0.11) 0%, transparent 68%);
  top: 38%; right: 12%; animation-duration: 32s; animation-delay: -16s;
}
@keyframes orb-drift {
  0%   { transform: translate(0, 0) scale(1); }
  30%  { transform: translate(25px, 35px) scale(1.06); }
  65%  { transform: translate(-20px, -25px) scale(0.96); }
  100% { transform: translate(14px, 18px) scale(1.03); }
}

/* ── Shell ──────────────────────────────────────────── */
#shell {
  position: fixed; inset: 0; z-index: 1;
  display: flex; flex-direction: column;
}

/* ── Header ─────────────────────────────────────────── */
.sa-hdr {
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px;
  padding: 11px 20px;
  border-bottom: 1px solid rgba(255,255,255,0.065);
  background: rgba(9,9,26,0.78);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}
.sa-hdr-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
.sa-hdr-logo {
  width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0;
  filter: drop-shadow(0 0 8px rgba(124,92,191,0.35));
}
.sa-hdr-name {
  font-size: 14.5px; font-weight: 650; color: #eeeeff; letter-spacing: -0.1px;
  white-space: nowrap;
}
.sa-model-pill {
  font-size: 10.5px; color: rgba(124,92,191,0.85);
  background: rgba(124,92,191,0.10);
  border: 1px solid rgba(124,92,191,0.22);
  border-radius: 999px; padding: 2px 9px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px;
}
.sa-hdr-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }

/* connection dot */
.sa-conn { display: flex; align-items: center; gap: 5px; font-size: 11px; color: #666688; }
.sa-conn-dot {
  width: 7px; height: 7px; border-radius: 50%; background: #444466;
  transition: background 0.3s, box-shadow 0.3s;
}
.sa-conn.ok   .sa-conn-dot { background: #60c98a; box-shadow: 0 0 6px rgba(96,201,138,0.5); }
.sa-conn.ok   .sa-conn-lbl { color: rgba(96,201,138,0.85); }
.sa-conn.fail .sa-conn-dot { background: #c96060; }
.sa-conn.fail .sa-conn-lbl { color: rgba(201,96,96,0.85); }

.sa-back {
  font-size: 11.5px; color: rgba(255,255,255,0.42); text-decoration: none;
  border: 1px solid rgba(255,255,255,0.09); border-radius: 999px;
  padding: 4px 13px; transition: all 0.15s; white-space: nowrap;
}
.sa-back:hover {
  color: rgba(255,255,255,0.85);
  border-color: rgba(124,92,191,0.5);
  background: rgba(124,92,191,0.10);
}

/* ── Body ───────────────────────────────────────────── */
.sa-body {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  padding: 0 max(16px, calc(50% - 380px));
  scroll-behavior: smooth;
  display: flex; flex-direction: column;
}
.sa-body::-webkit-scrollbar { width: 5px; }
.sa-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.09); border-radius: 3px; }

/* ── Hero ───────────────────────────────────────────── */
.sa-hero {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center; padding: 48px 20px 20px;
  animation: fade-up 0.45s ease both;
}
.sa-hero-icon {
  width: 76px; height: 76px; border-radius: 20px;
  margin-bottom: 22px;
  filter: drop-shadow(0 0 28px rgba(124,92,191,0.45));
  animation: icon-pulse 4s ease-in-out infinite alternate;
}
@keyframes icon-pulse {
  from { filter: drop-shadow(0 0 20px rgba(124,92,191,0.35)); }
  to   { filter: drop-shadow(0 0 36px rgba(124,92,191,0.60)); }
}
.sa-hero-title {
  font-size: 28px; font-weight: 700; color: #f2f2ff;
  letter-spacing: -0.4px; margin-bottom: 10px;
}
.sa-hero-sub { font-size: 14px; color: #55556a; line-height: 1.7; }

/* ── Messages ───────────────────────────────────────── */
.sa-msgs {
  display: flex; flex-direction: column; gap: 18px;
  padding: 24px 0 10px;
}

.sa-msg { display: flex; flex-direction: column; animation: fade-up 0.2s ease both; }

/* user */
.sa-msg.user { align-items: flex-end; }
.sa-msg.user .sa-bubble {
  background: linear-gradient(140deg, rgba(124,92,191,0.32), rgba(88,130,191,0.24));
  border: 1px solid rgba(124,92,191,0.32);
  border-radius: 18px 18px 5px 18px;
  padding: 10px 15px;
  color: #eeeeff; font-size: 14px; line-height: 1.58;
  max-width: 82%; word-break: break-word;
}

/* assistant */
.sa-msg.assistant { align-items: flex-start; }
.sa-msg.assistant .sa-bwrap {
  display: flex; gap: 10px; max-width: 92%;
}
.sa-msg.assistant .sa-av {
  width: 28px; height: 28px; border-radius: 9px; flex-shrink: 0; margin-top: 2px;
}
.sa-msg.assistant .sa-bubble {
  background: rgba(255,255,255,0.038);
  border: 1px solid rgba(255,255,255,0.075);
  border-radius: 5px 18px 18px 18px;
  padding: 12px 15px;
  color: #d4d4f0; font-size: 14px; line-height: 1.68; word-break: break-word;
  min-width: 60px;
}

/* ── Markdown styles inside bubble ─────────────────── */
.sa-bubble p { margin-bottom: 8px; }
.sa-bubble p:last-child { margin-bottom: 0; }
.sa-bubble ul, .sa-bubble ol { margin: 6px 0 8px 20px; }
.sa-bubble li { margin-bottom: 5px; }
.sa-bubble strong { color: #eeeeff; }
.sa-bubble em { color: #aaaacc; }
.sa-bubble h1, .sa-bubble h2, .sa-bubble h3 {
  color: #eeeeff; font-weight: 650; margin: 12px 0 6px;
}
.sa-bubble h1 { font-size: 17px; } .sa-bubble h2 { font-size: 15.5px; } .sa-bubble h3 { font-size: 14.5px; }
.sa-bubble code {
  background: rgba(255,255,255,0.09); border-radius: 4px;
  padding: 1px 5px; font-size: 12.5px;
  font-family: 'Consolas', 'Fira Code', monospace; color: #c4a8ff;
}
.sa-bubble pre {
  background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.07);
  border-radius: 9px; padding: 12px 14px; overflow-x: auto;
  margin: 10px 0; font-size: 12.5px;
  font-family: 'Consolas', 'Fira Code', monospace;
}
.sa-bubble pre code { background: none; padding: 0; color: #ccbbff; }
.sa-bubble blockquote {
  border-left: 3px solid rgba(124,92,191,0.5);
  padding-left: 12px; color: rgba(200,200,220,0.7); margin: 8px 0;
}
.sa-bubble a { color: rgba(124,92,191,0.9); text-decoration: underline; }
.sa-bubble hr { border: none; border-top: 1px solid rgba(255,255,255,0.08); margin: 10px 0; }

/* ── Thinking block ─────────────────────────────────── */
.sa-think {
  background: rgba(124,92,191,0.06);
  border: 1px solid rgba(124,92,191,0.18);
  border-radius: 9px; margin-bottom: 10px; overflow: hidden;
  font-size: 12.5px;
}
.sa-think summary {
  padding: 7px 11px; cursor: pointer; user-select: none;
  color: rgba(180,150,230,0.7); list-style: none;
  display: flex; align-items: center; gap: 6px;
}
.sa-think summary::-webkit-details-marker { display: none; }
.sa-think summary::before {
  content: '▶'; font-size: 8px; opacity: 0.7;
  transition: transform 0.14s; flex-shrink: 0;
}
.sa-think[open] summary::before { transform: rotate(90deg); }
.sa-think-body {
  padding: 6px 11px 11px; color: rgba(180,180,210,0.5);
  line-height: 1.65; white-space: pre-wrap; max-height: 300px; overflow-y: auto;
}

/* ── Message actions ────────────────────────────────── */
.sa-macts { display: flex; gap: 4px; margin-top: 5px; padding-left: 38px; }
.sa-mact {
  background: none; border: 1px solid rgba(255,255,255,0.07); border-radius: 999px;
  padding: 2px 9px; font-size: 11px; color: rgba(255,255,255,0.3);
  cursor: pointer; font-family: inherit; transition: all 0.12s;
}
.sa-mact:hover { color: rgba(255,255,255,0.7); border-color: rgba(255,255,255,0.18); }

/* ── Thinking indicator (dots) ──────────────────────── */
.sa-dots-wrap {
  display: flex; gap: 10px; align-items: center;
  padding: 8px 0; animation: fade-up 0.18s ease both;
}
.sa-dots-av { width: 28px; height: 28px; border-radius: 9px; flex-shrink: 0; }
.sa-dots {
  display: flex; gap: 5px;
  background: rgba(255,255,255,0.038);
  border: 1px solid rgba(255,255,255,0.075);
  border-radius: 5px 18px 18px 18px;
  padding: 12px 16px;
}
.sa-dots span {
  width: 6px; height: 6px; border-radius: 50%;
  background: rgba(124,92,191,0.65);
  animation: dot-pulse 1.3s ease-in-out infinite both;
}
.sa-dots span:nth-child(2) { animation-delay: 0.18s; }
.sa-dots span:nth-child(3) { animation-delay: 0.36s; }
@keyframes dot-pulse {
  0%, 80%, 100% { transform: scale(0.75); opacity: 0.4; }
  40%            { transform: scale(1.2);  opacity: 1; }
}

/* ── Error bubble ───────────────────────────────────── */
.sa-msg.err .sa-bubble {
  background: rgba(200,60,60,0.09) !important;
  border-color: rgba(200,60,60,0.22) !important;
  color: rgba(230,130,130,0.9) !important;
}

/* ── Quick-action chips ──────────────────────────────── */
.sa-chips {
  flex-shrink: 0;
  display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;
  padding: 10px max(16px, calc(50% - 380px)) 16px;
}
.sa-chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 14px; border-radius: 999px;
  border: 1px solid rgba(255,255,255,0.09);
  background: rgba(255,255,255,0.04);
  color: rgba(255,255,255,0.58); font-size: 12.5px;
  font-family: inherit; cursor: pointer; transition: all 0.14s;
  white-space: nowrap;
}
.sa-chip:hover {
  background: rgba(124,92,191,0.14);
  border-color: rgba(124,92,191,0.38);
  color: rgba(255,255,255,0.88);
}
.sa-chip-icon { font-style: normal; font-size: 13px; line-height: 1; }

/* ── Input area ─────────────────────────────────────── */
.sa-input-wrap {
  flex-shrink: 0;
  padding: 4px max(16px, calc(50% - 380px)) 20px;
}
.sa-input-card {
  background: rgba(255,255,255,0.055);
  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);
  border: 1px solid rgba(255,255,255,0.09);
  border-radius: 16px;
  transition: border-color 0.15s;
  overflow: hidden;
}
.sa-input-card:focus-within { border-color: rgba(124,92,191,0.42); }
.sa-ta {
  width: 100%; background: transparent; border: none; outline: none; resize: none;
  padding: 13px 15px 4px; color: #ddddf5; font-size: 14px;
  font-family: inherit; line-height: 1.58;
  min-height: 46px; max-height: 164px; overflow-y: auto;
}
.sa-ta::placeholder { color: rgba(255,255,255,0.28); }
.sa-ta::-webkit-scrollbar { width: 4px; }
.sa-ta::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }
.sa-input-foot {
  display: flex; align-items: center; justify-content: flex-end;
  padding: 6px 10px 10px; gap: 8px;
}
.sa-send {
  width: 36px; height: 36px; border-radius: 50%; border: none;
  background: linear-gradient(140deg, #7c5cbf 0%, #5882bf 100%);
  color: #fff; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s; flex-shrink: 0;
}
.sa-send:disabled { opacity: 0.3; cursor: not-allowed; transform: none !important; }
.sa-send:not(:disabled):hover {
  transform: scale(1.1);
  box-shadow: 0 0 16px rgba(124,92,191,0.55);
}
.sa-send svg { pointer-events: none; }
.sa-hint {
  text-align: center; font-size: 11.5px; color: rgba(255,255,255,0.22);
  margin-top: 8px; transition: color 0.2s; min-height: 16px;
}
.sa-hint.warn { color: rgba(210,140,80,0.8); }
.sa-hint.err  { color: rgba(210,90,90,0.8); }

/* ── Shared animation ───────────────────────────────── */
@keyframes fade-up {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* streaming caret */
.sa-streaming::after {
  content: '▋'; animation: caret-blink 0.85s ease-in-out infinite;
  color: rgba(124,92,191,0.6); margin-left: 2px;
}
@keyframes caret-blink {
  0%, 100% { opacity: 0; } 50% { opacity: 1; }
}

/* ── Offline overlay ────────────────────────────────── */
.sa-offline {
  display: none; position: fixed; inset: 0; z-index: 100;
  background: rgba(9,9,26,0.88); backdrop-filter: blur(10px);
  align-items: center; justify-content: center; flex-direction: column;
  text-align: center; gap: 14px; padding: 20px;
}
.sa-offline.show { display: flex; }
.sa-offline-icon { font-size: 42px; opacity: 0.6; }
.sa-offline-title { font-size: 18px; font-weight: 600; color: #cccce8; }
.sa-offline-sub { font-size: 13px; color: #555568; max-width: 300px; line-height: 1.6; }
.sa-offline-open {
  margin-top: 6px; padding: 9px 24px; border-radius: 999px;
  background: linear-gradient(140deg, rgba(124,92,191,0.7), rgba(88,130,191,0.6));
  border: none; color: #fff; font-size: 13px; font-family: inherit;
  cursor: pointer; transition: all 0.15s;
}
.sa-offline-open:hover { transform: scale(1.04); }
</style>
</head>
<body>

<!-- Animated background orbs -->
<div class="orb orb-1" aria-hidden="true"></div>
<div class="orb orb-2" aria-hidden="true"></div>
<div class="orb orb-3" aria-hidden="true"></div>

<div id="shell">
  <!-- ── Header ────────────────────────────── -->
  <header class="sa-hdr">
    <div class="sa-hdr-left">
      <img src="assets/brand/sutra/generated/sutra-assistant-icon-64.png" class="sa-hdr-logo" alt="">
      <span class="sa-hdr-name">Sutra Assistant</span>
      <span class="sa-model-pill" id="modelPill" hidden>—</span>
    </div>
    <div class="sa-hdr-right">
      <span class="sa-conn" id="connEl">
        <span class="sa-conn-dot"></span>
        <span class="sa-conn-lbl" id="connLbl">Connecting…</span>
      </span>
      <a href="Sutra.html" class="sa-back" id="backLink">↗ Open Sutra</a>
    </div>
  </header>

  <!-- ── Body ─────────────────────────────── -->
  <div class="sa-body" id="saBody">
    <!-- Empty-state hero -->
    <div class="sa-hero" id="heroEl">
      <img src="assets/brand/sutra/generated/sutra-assistant-icon-128.png" class="sa-hero-icon" alt="">
      <h1 class="sa-hero-title">Sutra Assistant</h1>
      <p class="sa-hero-sub">Ask anything about your notes,<br>homework, or studies.</p>
    </div>
    <!-- Messages list -->
    <div class="sa-msgs" id="msgsEl"></div>
  </div>

  <!-- ── Quick-action chips ────────────────── -->
  <div class="sa-chips" id="chipsEl"></div>

  <!-- ── Input ─────────────────────────────── -->
  <div class="sa-input-wrap">
    <div class="sa-input-card">
      <textarea id="saTA" class="sa-ta" placeholder="Ask anything…" rows="1" aria-label="Message"></textarea>
      <div class="sa-input-foot">
        <button class="sa-send" id="sendBtn" aria-label="Send" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
               stroke-linecap="round" stroke-linejoin="round" width="15" height="15" aria-hidden="true">
            <line x1="12" y1="19" x2="12" y2="5"/>
            <polyline points="5 12 12 5 19 12"/>
          </svg>
        </button>
      </div>
    </div>
    <p class="sa-hint" id="hintEl">Open Sutra in another tab to start chatting</p>
  </div>
</div>

<!-- ── Offline overlay ──────────────────────── -->
<div class="sa-offline" id="offlineOverlay" role="alertdialog" aria-modal="true"
     aria-label="Sutra not connected">
  <div class="sa-offline-icon" aria-hidden="true">⚡</div>
  <div class="sa-offline-title">Sutra isn't open</div>
  <p class="sa-offline-sub">Open Sutra in another tab to use the AI — it handles requests on your behalf.</p>
  <button class="sa-offline-open" id="offlineOpenBtn">Open Sutra</button>
</div>

<script>
/* ══════════════════════════════════════════════════════
   Sutra Assistant — fullscreen chat page
   ══════════════════════════════════════════════════════ */
'use strict';

const CHATS_KEY = 'sutra:assistantChats:v1';
const BC_NAME   = 'sutra-assistant-popout';
const PING_INTERVAL_MS = 28000;
const PING_TIMEOUT_MS  = 2800;
const SEND_TIMEOUT_MS  = 90000;

// ── DOM ──────────────────────────────────────────────
const bodyEl      = document.getElementById('saBody');
const heroEl      = document.getElementById('heroEl');
const msgsEl      = document.getElementById('msgsEl');
const chipsEl     = document.getElementById('chipsEl');
const saTA        = document.getElementById('saTA');
const sendBtn     = document.getElementById('sendBtn');
const hintEl      = document.getElementById('hintEl');
const connEl      = document.getElementById('connEl');
const connLbl     = document.getElementById('connLbl');
const modelPill   = document.getElementById('modelPill');
const offlineOverlay = document.getElementById('offlineOverlay');
const offlineOpenBtn = document.getElementById('offlineOpenBtn');
const backLink    = document.getElementById('backLink');

// ── State ────────────────────────────────────────────
let bc            = null;
let connected     = false;
let currentChatId = '';
let pendingReqId  = null;
let pingTimer     = null;
let pingTimeoutId = null;
let lastSentReqId = null;
let sendTimeoutId = null;

// ── Quick-action chips ───────────────────────────────
const CHIPS = [
  { icon: '✎', label: 'Explain this',     prompt: 'Can you explain this concept simply: ' },
  { icon: '⚡', label: 'Make a quiz',      prompt: 'Create a short practice quiz about: ' },
  { icon: '📄', label: 'Summarize notes',  prompt: 'Summarize the key points of: ' },
  { icon: '✓',  label: 'Check my work',   prompt: 'Check my work and give feedback: ' },
  { icon: '💡', label: 'Study tips',       prompt: 'Give me effective study tips for: ' },
  { icon: '📋', label: 'Make outline',     prompt: 'Create a structured outline for: ' },
  { icon: '🔑', label: 'Key terms',        prompt: 'List the most important key terms for: ' },
  { icon: '🗓', label: 'Study plan',       prompt: 'Help me make a study plan for: ' },
];
(function buildChips() {
  chipsEl.innerHTML = '';
  CHIPS.forEach(({ icon, label, prompt }) => {
    const btn = document.createElement('button');
    btn.className = 'sa-chip';
    btn.innerHTML = `<span class="sa-chip-icon">${icon}</span>${label}`;
    btn.addEventListener('click', () => {
      saTA.value = prompt;
      saTA.focus();
      autoResize();
      refreshSendState();
    });
    chipsEl.appendChild(btn);
  });
})();

// ── Textarea auto-resize ─────────────────────────────
function autoResize() {
  saTA.style.height = 'auto';
  saTA.style.height = Math.min(saTA.scrollHeight, 164) + 'px';
}
saTA.addEventListener('input', () => { autoResize(); refreshSendState(); });
saTA.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    if (!sendBtn.disabled) send();
  }
});

// ── Send state ───────────────────────────────────────
function refreshSendState() {
  const hasText = saTA.value.trim().length > 0;
  const busy    = pendingReqId !== null;
  sendBtn.disabled = !hasText || !connected || busy;
}

// ── Connection / BroadcastChannel ────────────────────
function setConnection(isConn, label) {
  connected = isConn;
  connEl.className = 'sa-conn ' + (isConn ? 'ok' : 'fail');
  connLbl.textContent = isConn ? 'Connected' : 'Disconnected';
  if (label) {
    modelPill.textContent = label;
    modelPill.hidden = false;
  }
  hintEl.textContent  = isConn
    ? 'Shift + Enter for a new line'
    : 'Open Sutra in another tab to chat';
  hintEl.className = 'sa-hint' + (isConn ? '' : ' warn');
  offlineOverlay.classList.toggle('show', !isConn && !hasChatHistory());
  refreshSendState();
}

function hasChatHistory() {
  return msgsEl.querySelectorAll('.sa-msg').length > 0;
}

function setupBC() {
  if (!window.BroadcastChannel) { setConnection(false, ''); return; }
  bc = new BroadcastChannel(BC_NAME);

  bc.onmessage = (e) => {
    const d = e.data || {};

    if (d.type === 'pong') {
      clearTimeout(pingTimeoutId); pingTimeoutId = null;
      const lbl = [d.providerLabel, d.model].filter(Boolean).join(' · ');
      setConnection(true, lbl || null);
      // Switch to the chat the main tab has open, if we don't have one yet
      if (!currentChatId && d.currentChatId) {
        currentChatId = d.currentChatId;
        loadMessages(currentChatId, true);
      }
    }

    if (d.type === 'aiDone' && d.requestId === pendingReqId) {
      clearTimeout(sendTimeoutId);
      pendingReqId = null;
      removeDots();
      loadMessages(currentChatId, true);
      refreshSendState();
    }

    if (d.type === 'aiError' && d.requestId === pendingReqId) {
      clearTimeout(sendTimeoutId);
      pendingReqId = null;
      removeDots();
      appendError(d.error || 'Something went wrong. Try again.');
      refreshSendState();
    }
  };

  bc.onmessageerror = () => setConnection(false, '');

  function schedulePing() {
    clearTimeout(pingTimer);
    pingTimer = setTimeout(ping, PING_INTERVAL_MS);
  }

  function ping() {
    if (!bc) return;
    try { bc.postMessage({ type: 'ping' }); } catch (err) { setConnection(false, ''); return; }
    pingTimeoutId = setTimeout(() => { setConnection(false, ''); schedulePing(); }, PING_TIMEOUT_MS);
    schedulePing();
  }

  ping(); // immediate first ping
}

// ── Init ─────────────────────────────────────────────
(function init() {
  const params = new URLSearchParams(window.location.search);
  currentChatId = params.get('chatId') || '';
  if (!currentChatId) {
    try {
      const store = JSON.parse(localStorage.getItem(CHATS_KEY) || '{}');
      currentChatId = store.currentChatId || '';
    } catch (_) {}
  }
  if (currentChatId) loadMessages(currentChatId, false);
  setupBC();

  // Update backLink to point to the same-origin Sutra page
  backLink.href = 'Sutra.html';

  offlineOpenBtn.addEventListener('click', () => {
    window.open('Sutra.html', '_blank', 'noopener');
    offlineOverlay.classList.remove('show');
  });
})();

// ── Storage sync ─────────────────────────────────────
window.addEventListener('storage', (e) => {
  if (e.key === CHATS_KEY) loadMessages(currentChatId, false);
});

// ── Load messages from localStorage ──────────────────
function loadMessages(chatId, scrollToBottom) {
  if (!chatId) return;
  try {
    const store = JSON.parse(localStorage.getItem(CHATS_KEY) || '{}');
    const convo = (store.conversations || []).find(c => c && c.id === chatId);
    if (!convo) return;
    const msgs = (convo.messages || []).filter(m => m && (m.role === 'user' || m.role === 'assistant'));
    renderMessages(msgs, scrollToBottom);
  } catch (_) {}
}

function renderMessages(msgs, scrollToBottom) {
  const hasContent = msgs.length > 0;
  heroEl.style.display  = hasContent ? 'none' : '';
  chipsEl.style.display = hasContent ? 'none' : '';
  msgsEl.innerHTML = '';

  msgs.forEach(m => appendBubble(m.role, m.content, m.thoughts, false));

  // re-attach dots if a request is pending
  if (pendingReqId !== null) showDots();

  if (scrollToBottom) requestAnimationFrame(() => { bodyEl.scrollTop = bodyEl.scrollHeight; });
}

// ── Append a message bubble ───────────────────────────
function appendBubble(role, content, thoughts, animate) {
  const wrap = document.createElement('div');
  wrap.className = 'sa-msg ' + (role === 'user' ? 'user' : 'assistant');
  if (!animate) wrap.style.animation = 'none';

  if (role === 'user') {
    const bub = document.createElement('div');
    bub.className = 'sa-bubble';
    bub.textContent = content;
    wrap.appendChild(bub);
  } else {
    const bwrap = document.createElement('div');
    bwrap.className = 'sa-bwrap';

    const av = document.createElement('img');
    av.src = 'assets/brand/sutra/generated/sutra-assistant-icon-32.png';
    av.className = 'sa-av'; av.alt = '';
    bwrap.appendChild(av);

    const right = document.createElement('div');
    right.style.cssText = 'min-width:0;flex:1;';

    if (thoughts && thoughts.length) {
      const det = document.createElement('details');
      det.className = 'sa-think';
      const sum = document.createElement('summary');
      sum.textContent = ' Thinking';
      det.appendChild(sum);
      const tbody = document.createElement('div');
      tbody.className = 'sa-think-body';
      tbody.textContent = thoughts.join('\n\n');
      det.appendChild(tbody);
      right.appendChild(det);
    }

    const bub = document.createElement('div');
    bub.className = 'sa-bubble';
    bub.innerHTML = mdToHtml(content);
    right.appendChild(bub);
    bwrap.appendChild(right);
    wrap.appendChild(bwrap);

    // copy button
    const acts = document.createElement('div');
    acts.className = 'sa-macts';
    const cpBtn = document.createElement('button');
    cpBtn.className = 'sa-mact'; cpBtn.textContent = '⧉ Copy';
    cpBtn.addEventListener('click', () => {
      navigator.clipboard && navigator.clipboard.writeText(content)
        .then(() => { cpBtn.textContent = '✓ Copied'; setTimeout(() => { cpBtn.textContent = '⧉ Copy'; }, 1800); });
    });
    acts.appendChild(cpBtn);
    wrap.appendChild(acts);
  }

  msgsEl.appendChild(wrap);
  return wrap;
}

function appendError(msg) {
  const wrap = document.createElement('div');
  wrap.className = 'sa-msg assistant err';
  const bwrap = document.createElement('div'); bwrap.className = 'sa-bwrap';
  const av = document.createElement('img');
  av.src = 'assets/brand/sutra/generated/sutra-assistant-icon-32.png';
  av.className = 'sa-av'; av.alt = '';
  bwrap.appendChild(av);
  const bub = document.createElement('div');
  bub.className = 'sa-bubble'; bub.textContent = '⚠ ' + msg;
  bwrap.appendChild(bub);
  wrap.appendChild(bwrap);
  msgsEl.appendChild(wrap);
  bodyEl.scrollTop = bodyEl.scrollHeight;
}

// ── Thinking dots ─────────────────────────────────────
function showDots() {
  removeDots();
  const w = document.createElement('div');
  w.className = 'sa-dots-wrap'; w.id = 'dotsEl';
  const av = document.createElement('img');
  av.src = 'assets/brand/sutra/generated/sutra-assistant-icon-32.png';
  av.className = 'sa-dots-av'; av.alt = '';
  w.appendChild(av);
  const d = document.createElement('div');
  d.className = 'sa-dots';
  d.innerHTML = '<span></span><span></span><span></span>';
  w.appendChild(d);
  msgsEl.appendChild(w);
  bodyEl.scrollTop = bodyEl.scrollHeight;
}
function removeDots() {
  const el = document.getElementById('dotsEl');
  if (el) el.remove();
}

// ── Send ──────────────────────────────────────────────
sendBtn.addEventListener('click', send);

function send() {
  const text = saTA.value.trim();
  if (!text || !connected || pendingReqId !== null) return;

  // Show user bubble immediately
  heroEl.style.display  = 'none';
  chipsEl.style.display = 'none';
  appendBubble('user', text, null, true);
  showDots();
  bodyEl.scrollTop = bodyEl.scrollHeight;

  saTA.value = ''; autoResize(); refreshSendState();

  const reqId = 'pop_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,7);
  pendingReqId = reqId;

  try {
    bc.postMessage({ type: 'sendMessage', message: text, chatId: currentChatId, requestId: reqId });
  } catch (_) {
    pendingReqId = null;
    removeDots();
    appendError('Could not reach Sutra. Is it open in another tab?');
    refreshSendState();
    return;
  }

  // Hard timeout fallback
  sendTimeoutId = setTimeout(() => {
    if (pendingReqId === reqId) {
      pendingReqId = null;
      removeDots();
      appendError('Request timed out. Try again.');
      refreshSendState();
    }
  }, SEND_TIMEOUT_MS);
}

// ── Minimal markdown → HTML ───────────────────────────
function mdToHtml(raw) {
  if (!raw) return '';

  // Escape HTML entities first
  let s = raw
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');

  // Fenced code blocks
  s = s.replace(/```[\w]*\n?([\s\S]*?)```/g, (_, code) =>
    `<pre><code>${code.trimEnd()}</code></pre>`);

  // Inline code
  s = s.replace(/`([^`\n]+)`/g, '<code>$1</code>');

  // Bold + italic
  s = s.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
  s = s.replace(/\*\*(.+?)\*\*/g,     '<strong>$1</strong>');
  s = s.replace(/__(.+?)__/g,          '<strong>$1</strong>');
  s = s.replace(/\*(.+?)\*/g,         '<em>$1</em>');
  s = s.replace(/_([^_\n]+)_/g,        '<em>$1</em>');

  // Headings
  s = s.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  s = s.replace(/^## (.+)$/gm,  '<h2>$1</h2>');
  s = s.replace(/^# (.+)$/gm,   '<h1>$1</h1>');

  // Horizontal rule
  s = s.replace(/^---+$/gm, '<hr>');

  // Blockquote
  s = s.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');

  // Unordered lists (process consecutive lines)
  s = s.replace(/((?:^[•\-\*] .+\n?)+)/gm, match => {
    const items = match.trim().split('\n').map(l => `<li>${l.replace(/^[•\-\*] /, '')}</li>`).join('');
    return `<ul>${items}</ul>`;
  });

  // Ordered lists
  s = s.replace(/((?:^\d+\. .+\n?)+)/gm, match => {
    const items = match.trim().split('\n').map(l => `<li>${l.replace(/^\d+\. /, '')}</li>`).join('');
    return `<ol>${items}</ol>`;
  });

  // Paragraphs: double newlines between non-block-level content
  s = s.split(/\n{2,}/).map(para => {
    para = para.trim();
    if (!para) return '';
    if (/^<(h[1-6]|ul|ol|pre|hr|blockquote)/.test(para)) return para;
    return `<p>${para.replace(/\n/g, '<br>')}</p>`;
  }).join('');

  return s;
}
